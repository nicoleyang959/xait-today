      <section id="saved-projects" class="saved-projects" hidden aria-labelledby="records-heading" data-no-i18n>
        <header class="records-header">
          <div>
            <h2 id="records-heading" tabindex="-1" data-records-text="heading">我的项目</h2>
            <p class="records-intro" data-records-text="intro">把值得研究的项目留下来，笔记只对你的账号可见。</p>
          </div>
          <a class="records-button records-back" id="records-back" href="#main-content" data-records-text="back">返回日报</a>
        </header>

        <div class="records-feedback" id="records-feedback" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="records-gate" id="records-gate">
          <h3 id="records-gate-heading" data-records-text="unconfiguredHeading">云收藏尚未启用</h3>
          <p id="records-gate-message" data-records-text="unconfigured">站点尚未配置私人同步服务。你仍可正常阅读日报，配置完成后再登录收藏。</p>
          <button class="records-button records-primary" id="records-login" type="button" hidden data-records-text="login">用 GitHub 登录</button>
          <p class="records-privacy" data-records-text="privacy">收藏与笔记保存在本机和站点配置的 Supabase 服务中，不会写进公开日报或 GitHub 仓库。首次登录需要联网。</p>
        </div>

        <div id="records-workspace" hidden>
          <div class="records-account-bar">
            <span id="records-account" class="records-account"></span>
            <span id="records-sync-state" class="records-sync-state" role="status" aria-live="polite"></span>
            <button class="records-button" id="records-sync" type="button" data-records-text="sync">立即同步</button>
            <button class="records-button" id="records-signout" type="button" data-records-text="signout">退出账号</button>
          </div>

          <div class="records-tools">
            <label class="records-search-label" for="records-search">
              <span data-records-text="searchLabel">搜索项目</span>
              <input id="records-search" type="search" maxlength="200" autocomplete="off" data-records-placeholder="searchPlaceholder" placeholder="名称、链接或笔记">
            </label>
            <label for="records-filter">
              <span data-records-text="filterLabel">跟进状态</span>
              <select id="records-filter">
                <option value="all" data-records-text="all">全部状态</option>
                <option value="to_research" data-records-text="to_research">待研究</option>
                <option value="tried" data-records-text="tried">已体验</option>
                <option value="watching" data-records-text="watching">重点关注</option>
              </select>
            </label>
          </div>

          <details class="records-add" id="records-add">
            <summary data-records-text="manualAdd">手动添加项目</summary>
            <form id="records-manual-form" class="records-form">
              <label for="records-manual-title"><span data-records-text="projectName">项目名称</span><input id="records-manual-title" name="title" required maxlength="200" autocomplete="off"></label>
              <label for="records-manual-url"><span data-records-text="projectUrl">项目链接</span><input id="records-manual-url" name="url" type="url" required maxlength="2048" autocomplete="off" inputmode="url"></label>
              <p class="records-help" data-records-text="manualHelp">只保存你输入的链接，不访问目标网站或自动抓取内容。</p>
              <button class="records-button records-primary" type="submit" data-records-text="saveProject">收藏项目</button>
            </form>
          </details>

          <div class="records-backup-tools" role="group" aria-label="项目备份" data-records-aria="backupLabel">
            <button class="records-button" id="records-export-json" type="button" data-records-text="exportJson">导出 JSON 备份</button>
            <button class="records-button" id="records-export-markdown" type="button" data-records-text="exportMarkdown">导出 Markdown</button>
            <button class="records-button" id="records-import" type="button" data-records-text="importJson">导入 JSON 备份</button>
            <input id="records-import-file" type="file" accept="application/json,.json" hidden aria-label="选择 JSON 备份" data-records-aria="chooseBackup">
          </div>

          <p id="records-count" class="records-count"></p>
          <p id="records-empty" class="records-empty" data-records-text="empty">还没有收藏项目。在日报里点击“收藏”，或手动添加一个项目链接。</p>
          <ul id="records-list" class="records-list" aria-label="已收藏项目" data-records-aria="savedList"></ul>

          <section id="records-editor" class="records-editor" hidden aria-labelledby="records-editor-heading">
            <h3 id="records-editor-heading" tabindex="-1" data-records-text="editHeading">项目笔记</h3>
            <form id="records-edit-form" class="records-form">
              <input id="records-edit-id" type="hidden">
              <label for="records-edit-title"><span data-records-text="projectName">项目名称</span><input id="records-edit-title" required maxlength="200" autocomplete="off"></label>
              <label for="records-edit-status"><span data-records-text="filterLabel">跟进状态</span><select id="records-edit-status"><option value="to_research" data-records-text="to_research">待研究</option><option value="tried" data-records-text="tried">已体验</option><option value="watching" data-records-text="watching">重点关注</option></select></label>
              <label class="records-notes-label" for="records-edit-notes"><span data-records-text="notes">为什么值得关注？</span><textarea id="records-edit-notes" rows="7" maxlength="5000" data-records-placeholder="notesPlaceholder" placeholder="记下用途、想试的功能，或你自己的判断。" data-no-i18n></textarea></label>
              <p class="records-help" data-records-text="noteHelp">最多 5,000 字。笔记保留你输入的语言，不会自动翻译。</p>
              <div class="records-edit-actions"><button class="records-button records-primary" type="submit" data-records-text="saveNotes">保存笔记</button><button class="records-button" id="records-editor-close" type="button" data-records-text="closeEditor">收起编辑</button></div>
            </form>
          </section>
        </div>
      </section>
      <dialog id="records-dialog" class="records-dialog" aria-labelledby="records-dialog-title" aria-describedby="records-dialog-message" data-no-i18n>
        <form method="dialog">
          <h2 id="records-dialog-title"></h2>
          <p id="records-dialog-message"></p>
          <div id="records-dialog-detail" class="records-dialog-detail"></div>
          <div id="records-dialog-actions" class="records-dialog-actions"></div>
        </form>
      </dialog>
      <div id="records-toast" class="records-toast" role="status" aria-live="polite" aria-atomic="true" hidden data-no-i18n></div>
